
name: Pro11 TWRP Source Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Pro11 repository
        uses: actions/checkout@v4

      - name: Install repo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 unzip

      - name: Initialize Omni TWRP source
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$GITHUB_WORKSPACE/twrp-source"
          cd "$GITHUB_WORKSPACE/twrp-source"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

      - name: Check source manifest
        run: |
          cd "$GITHUB_WORKSPACE/twrp-source"
          test -f .repo/manifest.xml
          echo "Omni TWRP 8.1 manifest initialized."
          echo "Full source sync and compilation have not started."

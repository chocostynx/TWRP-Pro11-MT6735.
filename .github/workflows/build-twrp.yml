
name: Pro11 TWRP Build Configuration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Pro11 repository
        uses: actions/checkout@v4




      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 unzip bc \
            build-essential flex bison zip \
            libssl-dev libncurses-dev \
            libncurses5 libtinfo5

          echo "=== Python 3 ==="
          python3 --version

          echo "=== Legacy libraries ==="
          ldconfig -p | grep -E 'libncurses.so.5|libtinfo.so.5'

          python3 --version
          git --version

      
      - name: Verify legacy Clang libraries
        shell: bash
        run: |
          ldconfig -p | grep -E 'libncurses.so.5|libtinfo.so.5'

        
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Java version
        shell: bash
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

          
      - name: Setup Python 2.7
        uses: actions/setup-python@v5
        with:
          python-version: '2.7'

      - name: Configure legacy Python
        shell: bash
        run: |
          mkdir -p "$HOME/legacy-python"
          ln -sf "$(which python2)" "$HOME/legacy-python/python"
          echo "$HOME/legacy-python" >> "$GITHUB_PATH"

          python --version
          python2 --version


      - name: Initialize and sync Omni source
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/twrp-source"
          cd "$RUNNER_TEMP/twrp-source"

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

          repo sync -c --no-tags -j2 --fail-fast


      - name: Install Pro11 device tree
        shell: bash
        run: |
          SRC="$RUNNER_TEMP/twrp-source"
          DEVICE="$SRC/device/xsd/Pro11"
          ARCHIVE="$RUNNER_TEMP/pro11-archive"

          mkdir -p "$ARCHIVE"
          mkdir -p "$SRC/device/xsd"

          unzip -q \
            "$GITHUB_WORKSPACE/TWRP_Pro11_MT6735_DeviceTree_DRAFT_v2.zip" \
            -d "$ARCHIVE"

          cp -a \
            "$ARCHIVE/TWRP_Pro11_MT6735_DeviceTree_v2/device/xsd/Pro11" \
            "$SRC/device/xsd/"

          cat > "$DEVICE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/omni_Pro11.mk

          COMMON_LUNCH_CHOICES := \
              omni_Pro11-eng
          EOF

          cat > "$DEVICE/omni_Pro11.mk" <<'EOF'
          $(call inherit-product, vendor/omni/config/common.mk)

          PRODUCT_NAME := omni_Pro11
          PRODUCT_DEVICE := Pro11
          PRODUCT_BRAND := XSD
          PRODUCT_MODEL := Pro11
          PRODUCT_MANUFACTURER := XSD
          PRODUCT_PLATFORM := mt6735
          EOF

          echo "=== AndroidProducts.mk ==="
          cat "$DEVICE/AndroidProducts.mk"

          echo "=== omni_Pro11.mk ==="
          cat "$DEVICE/omni_Pro11.mk"

          test -f "$DEVICE/AndroidProducts.mk"
          test -f "$DEVICE/omni_Pro11.mk"
          test -f "$DEVICE/BoardConfig.mk"
          test -f "$DEVICE/prebuilt/kernel"

          echo "Pro11 product files verified."


      
      - name: Inspect TWRP product configuration
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          echo "=== Product configuration files ==="
          find build/target/product -maxdepth 1 -type f | sort | head -80

          echo "=== TWRP common configuration ==="
          find vendor -path "*/config/common.mk" -type f | head -30

          echo "=== eng.mk locations ==="
          find . -path "*/product/eng.mk" -type f | head -20

          echo "=== Current Pro11 product file ==="
          cat device/xsd/Pro11/omni_Pro11.mk

      

      - name: Patch Python compatibility
        shell: bash
        run: |
          FILE="$RUNNER_TEMP/twrp-source/vendor/omni/build/tools/roomservice.py"

          echo "=== Original Python syntax ==="
          grep -n "except IOError" "$FILE"

          sed -i 's/except IOError, ES\.ParseError:/except (IOError, ES.ParseError):/' "$FILE"

          echo "=== Patched Python syntax ==="
          grep -n "except (IOError" "$FILE"

          python3 -m py_compile "$FILE"

          echo "Python compatibility patch passed."

          

      - name: Check Omni lunch target
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          export ALLOW_MISSING_DEPENDENCIES=true

          test -f vendor/omni/config/common.mk
          source build/envsetup.sh
          lunch omni_Pro11-eng

          echo "PRODUCT_NAME variable: $PRODUCT_NAME"
          echo "TARGET_PRODUCT variable: $TARGET_PRODUCT"
          echo "TARGET_DEVICE variable: $TARGET_DEVICE"

          echo "=== Build configuration ==="
          echo "PRODUCT_NAME=$(get_build_var PRODUCT_NAME)"
          echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)"
          echo "TARGET_ARCH=$(get_build_var TARGET_ARCH)"
          echo "TARGET_PREBUILT_KERNEL=$(get_build_var TARGET_PREBUILT_KERNEL)"

          test "$(get_build_var TARGET_PRODUCT)" = "omni_Pro11"
          test "$(get_build_var TARGET_DEVICE)" = "Pro11"
          test "$(get_build_var TARGET_ARCH)" = "arm"
          test -f "$(get_build_var TARGET_PREBUILT_KERNEL)"

          echo "Pro11 build target checks passed."

          
      - name: Compile Pro11 TWRP recovery
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch omni_Pro11-eng

          echo "=== Disk space before build ==="
          df -h /

          echo "=== Starting recoveryimage build ==="
          mka recoveryimage -j2

          echo "=== Searching recovery image ==="
          find out/target/product -maxdepth 3 \
            -type f -name "recovery.img" -ls

          test -s out/target/product/Pro11/recovery.img

          echo "TWRP recovery image build completed."

      - name: Upload Pro11 recovery image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Pro11-MT6735
          path: |
            ${{ runner.temp }}/twrp-source/out/target/product/Pro11/recovery.img
          if-no-files-found: error
          retention-days: 14
          

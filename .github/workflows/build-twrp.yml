
name: Pro11 TWRP Build Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - name: Check available disk space
        run: |
          echo "=== Disk space ==="
          df -h /
          echo "=== Memory ==="
          free -h
          echo "=== CPU ==="
          nproc


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev \
            libxml2-utils xsltproc unzip bc \
            python2 python3

      - name: Check Python
        run: |
          python2 --version
          python3 --version


      - name: Preparation summary
        run: |
          echo "Runner preparation completed."
          echo "No Android source has been synced."
          echo "No recovery image has been compiled."
          

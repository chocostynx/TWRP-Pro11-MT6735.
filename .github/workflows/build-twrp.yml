
name: Pro11 TWRP Build Configuration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Pro11 repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 unzip bc \
            build-essential flex bison zip libssl-dev \
            libncurses-dev

      - name: Initialize and sync Omni source
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/twrp-source"
          cd "$RUNNER_TEMP/twrp-source"

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

          repo sync -c --no-tags -j2 --fail-fast

      - name: Install Pro11 device tree
        shell: bash
        run: |
          SRC="$RUNNER_TEMP/twrp-source"
          DEVICE="$SRC/device/xsd/Pro11"
          ARCHIVE="$RUNNER_TEMP/pro11-archive"

          mkdir -p "$ARCHIVE"
          mkdir -p "$SRC/device/xsd"

          unzip -q \
            "$GITHUB_WORKSPACE/TWRP_Pro11_MT6735_DeviceTree_DRAFT_v2.zip" \
            -d "$ARCHIVE"

          cp -a \
            "$ARCHIVE/TWRP_Pro11_MT6735_DeviceTree_v2/device/xsd/Pro11" \
            "$SRC/device/xsd/"

          cp "$DEVICE/twrp_Pro11.mk" "$DEVICE/omni_Pro11.mk"

          cat > "$DEVICE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/omni_Pro11.mk

          COMMON_LUNCH_CHOICES := \
              omni_Pro11-eng
          EOF

          test -f "$DEVICE/AndroidProducts.mk"
          test -f "$DEVICE/omni_Pro11.mk"
          test -f "$DEVICE/BoardConfig.mk"

          echo "=== AndroidProducts.mk ==="
          cat "$DEVICE/AndroidProducts.mk"
          echo "Pro11 device tree installed."

      - name: Check Omni lunch target
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          source build/envsetup.sh
          lunch omni_Pro11-eng

          echo "=== Build configuration ==="
          echo "PRODUCT_NAME=$(get_build_var PRODUCT_NAME)"
          echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)"
          echo "TARGET_ARCH=$(get_build_var TARGET_ARCH)"
          echo "TARGET_PREBUILT_KERNEL=$(get_build_var TARGET_PREBUILT_KERNEL)"

          test "$(get_build_var PRODUCT_NAME)" = "omni_Pro11"
          test "$(get_build_var TARGET_DEVICE)" = "Pro11"
          test -f "$(get_build_var TARGET_PREBUILT_KERNEL)"

          echo "Pro11 lunch target and prebuilt kernel checks passed."
          df -h /
          

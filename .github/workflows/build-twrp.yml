
name: Pro11 TWRP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout repository
      - name: Checkout Pro11 repository
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git curl wget unzip zip \
            python3 python3-dev \
            python2.7 python2.7-dev \
            bc bison flex build-essential \
            libssl-dev libncurses-dev \
            libncurses5 libtinfo5 \
            zlib1g-dev libxml2-utils \
            xsltproc rsync ccache

          echo "=== Python ==="
          python3 --version
          python2.7 --version

          echo "=== Legacy libraries ==="
          ldconfig -p | grep -E 'libncurses.so.5|libtinfo.so.5'

      # 3. Configure legacy Python
      - name: Configure Python 2.7
        shell: bash
        run: |
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2

          mkdir -p "$HOME/legacy-python"
          ln -sf /usr/bin/python2.7 "$HOME/legacy-python/python"

          echo "$HOME/legacy-python" >> "$GITHUB_PATH"

          export PATH="$HOME/legacy-python:$PATH"

          python --version
          python2 --version
          python3 --version

      # 4. Setup Java 8
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Java
        shell: bash
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 5. Initialize Omni source
      - name: Initialize and sync Omni source
        shell: bash
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"

          mkdir -p "$RUNNER_TEMP/twrp-source"
          cd "$RUNNER_TEMP/twrp-source"

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

          repo sync -c --no-tags -j2 --fail-fast

      # 6. Install Pro11 device tree
      - name: Install Pro11 device tree
        shell: bash
        run: |
          SRC="$RUNNER_TEMP/twrp-source"
          DEVICE="$SRC/device/xsd/Pro11"
          ARCHIVE="$RUNNER_TEMP/pro11-archive"

          mkdir -p "$ARCHIVE"
          mkdir -p "$SRC/device/xsd"

          unzip -q \
            "$GITHUB_WORKSPACE/TWRP_Pro11_MT6735_DeviceTree_DRAFT_v2.zip" \
            -d "$ARCHIVE"

          cp -a \
            "$ARCHIVE/TWRP_Pro11_MT6735_DeviceTree_v2/device/xsd/Pro11" \
            "$SRC/device/xsd/"

          # Configure Omni product
          cat > "$DEVICE/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/omni_Pro11.mk

          COMMON_LUNCH_CHOICES := \
              omni_Pro11-eng
          EOF

          cat > "$DEVICE/omni_Pro11.mk" <<'EOF'
          $(call inherit-product, vendor/omni/config/common.mk)

          PRODUCT_NAME := omni_Pro11
          PRODUCT_DEVICE := Pro11
          PRODUCT_BRAND := XSD
          PRODUCT_MODEL := Pro11
          PRODUCT_MANUFACTURER := XSD
          PRODUCT_PLATFORM := mt6735
          EOF

          # Ensure touchscreen ueventd file exists
          mkdir -p "$DEVICE/recovery/root"

          if [ ! -f "$DEVICE/recovery/root/ueventd.mt6735.rc" ]; then
            cat > "$DEVICE/recovery/root/ueventd.mt6735.rc" <<'EOF'
          /dev/touch 0660 root system
          EOF
          fi

          echo "=== Device tree files ==="
          find "$DEVICE" -maxdepth 5 -type f | sort

          test -f "$DEVICE/BoardConfig.mk"
          test -f "$DEVICE/device.mk"
          test -f "$DEVICE/prebuilt/kernel"
          test -f "$DEVICE/recovery/root/etc/recovery.fstab"
          test -f "$DEVICE/recovery/root/ueventd.mt6735.rc"
          test -f "$DEVICE/AndroidProducts.mk"
          test -f "$DEVICE/omni_Pro11.mk"

          echo "Pro11 device tree verified."

      # 7. Patch known Python compatibility issue
      - name: Patch Python compatibility
        shell: bash
        run: |
          FILE="$RUNNER_TEMP/twrp-source/vendor/omni/build/tools/roomservice.py"

          if [ -f "$FILE" ]; then
            sed -i \
              's/except IOError, ES\.ParseError:/except (IOError, ES.ParseError):/' \
              "$FILE"

            python3 -m py_compile "$FILE"
            echo "roomservice.py compatibility check passed."
          else
            echo "roomservice.py not found; skipping."
          fi

      # 8. Check Omni lunch target
      - name: Check Omni lunch target
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="$HOME/legacy-python:$PATH"

          source build/envsetup.sh
          lunch omni_Pro11-eng

          echo "=== Product configuration ==="

          echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
          echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)"
          echo "TARGET_ARCH=$(get_build_var TARGET_ARCH)"
          echo "TARGET_ARCH_VARIANT=$(get_build_var TARGET_ARCH_VARIANT)"
          echo "TARGET_CPU_VARIANT=$(get_build_var TARGET_CPU_VARIANT)"

          echo "=== Boot image configuration ==="

          echo "BOARD_KERNEL_BASE=$(get_build_var BOARD_KERNEL_BASE)"
          echo "BOARD_KERNEL_OFFSET=$(get_build_var BOARD_KERNEL_OFFSET)"
          echo "BOARD_RAMDISK_OFFSET=$(get_build_var BOARD_RAMDISK_OFFSET)"
          echo "BOARD_TAGS_OFFSET=$(get_build_var BOARD_TAGS_OFFSET)"
          echo "BOARD_KERNEL_PAGESIZE=$(get_build_var BOARD_KERNEL_PAGESIZE)"

          echo "=== Kernel ==="

          KERNEL="$(get_build_var TARGET_PREBUILT_KERNEL)"
          echo "TARGET_PREBUILT_KERNEL=$KERNEL"

          test "$(get_build_var TARGET_PRODUCT)" = "omni_Pro11"
          test "$(get_build_var TARGET_DEVICE)" = "Pro11"
          test "$(get_build_var TARGET_ARCH)" = "arm"
          test -f "$KERNEL"

          echo "Pro11 lunch target passed."

      # 9. Inspect mkbootimg implementation
      - name: Inspect boot image build configuration
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          REPORT="$RUNNER_TEMP/boot-config-report.txt"

          {
            echo "=== BoardConfig values ==="
            grep -nE \
              'BOARD_KERNEL_BASE|BOARD_KERNEL_OFFSET|BOARD_RAMDISK_OFFSET|BOARD_TAGS_OFFSET|BOARD_KERNEL_PAGESIZE' \
              device/xsd/Pro11/BoardConfig.mk || true

            echo
            echo "=== RAMDISK OFFSET references ==="

            grep -R -n \
              "BOARD_RAMDISK_OFFSET" \
              build core device vendor \
              --include="*.mk" \
              --include="*.py" \
              --include="*.sh" \
              2>/dev/null | head -100 || true

            echo
            echo "=== MKBOOTIMG references ==="

            grep -R -n \
              "mkbootimg" \
              build/core \
              --include="*.mk" \
              --include="*.py" \
              --include="*.sh" \
              2>/dev/null | head -100 || true

            echo
            echo "=== Available mkbootimg tools ==="

            find . -iname '*mkbootimg*' -type f | head -50

          } | tee "$REPORT"

      # 10. Compile recovery
      - name: Compile Pro11 TWRP recovery
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp-source"

          export ALLOW_MISSING_DEPENDENCIES=true
          export PATH="$HOME/legacy-python:$PATH"

          source build/envsetup.sh
          lunch omni_Pro11-eng

          echo "=== Disk space before build ==="
          df -h /

          echo "=== Starting recovery build ==="

          set -o pipefail

          mka recoveryimage -j2 \
            2>&1 | tee "$RUNNER_TEMP/twrp-build.log"

          RECOVERY="out/target/product/Pro11/recovery.img"

          test -s "$RECOVERY"

          echo "=== Recovery image ==="
          ls -lh "$RECOVERY"
          stat -c '%s bytes' "$RECOVERY"

          echo "Recovery build completed."

      # 11. Inspect recovery header
      - name: Inspect recovery image
        shell: bash
        run: |
          RECOVERY="$RUNNER_TEMP/twrp-source/out/target/product/Pro11/recovery.img"

          test -s "$RECOVERY"

          echo "=== Recovery header ==="

          python3 - "$RECOVERY" <<'PY'
          import struct
          import sys
          import hashlib

          path = sys.argv[1]

          with open(path, "rb") as f:
              header = f.read(64)

          if header[:8] != b"ANDROID!":
              raise SystemExit("ERROR: Invalid Android boot image")

          print("Magic:", header[:8])
          print("Kernel size:", struct.unpack_from("<I", header, 8)[0])
          print("Kernel address:", hex(struct.unpack_from("<I", header, 12)[0]))
          print("Ramdisk size:", struct.unpack_from("<I", header, 16)[0])
          print("Ramdisk address:", hex(struct.unpack_from("<I", header, 20)[0]))
          print("Second size:", struct.unpack_from("<I", header, 24)[0])
          print("Second address:", hex(struct.unpack_from("<I", header, 28)[0]))
          print("Tags address:", hex(struct.unpack_from("<I", header, 32)[0]))
          print("Page size:", struct.unpack_from("<I", header, 36)[0])

          with open(path, "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()

          print("Recovery SHA256:", digest)
          PY

          echo "=== Kernel SHA256 ==="

          sha256sum \
            "$RUNNER_TEMP/twrp-source/device/xsd/Pro11/prebuilt/kernel"

      # 12. Collect diagnostic reports
      - name: Collect build reports
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pro11-reports"

          if [ -f "$RUNNER_TEMP/twrp-build.log" ]; then
            cp "$RUNNER_TEMP/twrp-build.log" \
              "$RUNNER_TEMP/pro11-reports/"
          fi

          if [ -f "$RUNNER_TEMP/boot-config-report.txt" ]; then
            cp "$RUNNER_TEMP/boot-config-report.txt" \
              "$RUNNER_TEMP/pro11-reports/"
          fi

      # 13. Upload artifacts
      - name: Upload Pro11 recovery and reports
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Pro11-MT6735
          path: |
            ${{ runner.temp }}/twrp-source/out/target/product/Pro11/recovery.img
            ${{ runner.temp }}/pro11-reports/
          if-no-files-found: error
          retention-days: 14
